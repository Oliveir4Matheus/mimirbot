<filter id="blur" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="7"/></filter>
<clipPath id="clip"><use href="#body" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#body"/></clipPath>
</defs>
