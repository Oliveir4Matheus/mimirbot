<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Quadrado orgânico — Pérola</title>
<desc>Variação de silhueta quadrado orgânico com olhos minimalistas e acabamento prata perolado.</desc>
<defs>
<path id="body" d="M235 92 C300 83 358 91 386 119 C411 144 407 188 402 246 C397 311 405 354 375 379 C348 402 304 397 245 392 C179 387 131 397 110 364 C90 335 103 290 106 235 C110 172 100 131 133 109 C157 93 193 98 235 92 Z"/>
<radialGradient id="pearl" cx="27%" cy="12%" r="106%"><stop stop-color="#FFFFFF"/><stop offset=".3" stop-color="#F7F8FB"/><stop offset=".65" stop-color="#D7DBE3"/><stop offset="1" stop-color="#A0A8B8"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".6" stop-color="#FFF" stop-opacity=".15"/><stop offset="1" stop-color="#808A9E" stop-opacity=".3"/></linearGradient>
<linearGradient id="eye" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2FC"/></linearGradient>
