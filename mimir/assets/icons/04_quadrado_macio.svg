<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Quadrado macio — Pérola</title>
<desc>Variação de silhueta quadrado macio com olhos minimalistas e acabamento pêssego perolado.</desc>
<defs>
<path id="body" d="M256 101 C321 101 360 106 382 129 C405 152 407 187 407 252 C407 317 405 354 382 377 C359 400 321 403 256 403 C191 403 153 400 130 377 C107 354 105 317 105 252 C105 187 107 152 130 129 C152 106 191 101 256 101 Z"/>
