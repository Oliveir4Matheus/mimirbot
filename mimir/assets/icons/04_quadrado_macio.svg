<linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".6" stop-color="#FFF" stop-opacity=".15"/><stop offset="1" stop-color="#B88A68" stop-opacity=".3"/></linearGradient>
