<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Quadrado alto — Pervinca Pérola</title>
<desc>Personagem quadrado alto com acabamento perolado na cor pervinca e fundo transparente.</desc>
<defs>
