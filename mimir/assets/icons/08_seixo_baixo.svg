<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Seixo baixo — Coral Pérola</title>
<desc>Personagem seixo baixo com acabamento perolado na cor coral e fundo transparente.</desc>
<defs>
<path id="body" d="M90 267 C77 206 128 151 195 153 C231 154 265 164 300 150 C356 128 413 173 425 232 C443 302 389 348 313 358 C213 373 105 337 90 267 Z"/>
<radialGradient id="pearl" cx="27%" cy="12%" r="106%"><stop stop-color="#FFFFFF"/><stop offset=".3" stop-color="#FFF2EF"/><stop offset=".65" stop-color="#F1BFB5"/><stop offset="1" stop-color="#D98F84"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".6" stop-color="#FFF" stop-opacity=".15"/><stop offset="1" stop-color="#BB746C" stop-opacity=".3"/></linearGradient>
<linearGradient id="eye" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2FC"/></linearGradient>
