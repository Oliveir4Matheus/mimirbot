<path d="M135 189 C151 150 181 125 211 115" fill="none" stroke="#FFF" stroke-width="2.4" opacity=".64" stroke-linecap="round"/>
</g>
<use href="#body" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#body" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
<g>
