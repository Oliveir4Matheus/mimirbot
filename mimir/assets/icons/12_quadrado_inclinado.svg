<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Quadrado inclinado — Damasco Pérola</title>
<desc>Personagem quadrado inclinado com acabamento perolado na cor damasco e fundo transparente.</desc>
<defs>
<path id="body" d="M256 106 C316 106 353 108 374 130 C395 152 398 187 398 248 C398 309 395 344 374 366 C353 388 316 390 256 390 C196 390 159 388 138 366 C117 344 114 309 114 248 C114 187 117 152 138 130 C159 108 196 106 256 106 Z" transform="rotate(10 256 248)"/>
<radialGradient id="pearl" cx="27%" cy="12%" r="106%"><stop stop-color="#FFFFFF"/><stop offset=".3" stop-color="#FFF5EC"/><stop offset=".65" stop-color="#ECC5A6"/><stop offset="1" stop-color="#C89269"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".6" stop-color="#FFF" stop-opacity=".15"/><stop offset="1" stop-color="#AC7954" stop-opacity=".3"/></linearGradient>
<linearGradient id="eye" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2FC"/></linearGradient>
