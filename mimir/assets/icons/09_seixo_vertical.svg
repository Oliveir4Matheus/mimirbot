<rect x="268" y="208" width="48" height="66" rx="24" fill="url(#eye)"/>
<rect x="219" y="228" width="16" height="31" rx="8" fill="url(#pupil)"/>
<rect x="293" y="228" width="16" height="31" rx="8" fill="url(#pupil)"/>
