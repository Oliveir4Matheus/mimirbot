# The fork's own release: Linux x64, the only platform this repository can
# build without Apple Developer credentials.
#
# Upstream's release.yml builds macOS (signed, notarized, stapled), Windows and
# Linux, then mirrors every asset into milind-soni/openmausbot-releases with
# RELEASES_PAT. The fork has neither the Apple secrets nor write access to that
# repository, so that pipeline cannot finish here. Releases v0.1.147 to v0.1.150
# were built by hand on a laptop with the same packaging commands; this workflow
# does that on a runner, with the smoke gates the CI lane already proves green.
#
# Manual on purpose: a version bump should not spend 45 runner minutes on its
# own. Run it from Actions → Release (fork, Linux x64).
name: Release (fork, Linux x64)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immediately (untick to leave the release as a draft)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  linux:
    name: Ubuntu 24.04 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: "Gate: installed browser works with Ubuntu sandbox restrictions"
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/MimirBot/resources
      - name: Launch the packaged app and verify its lifecycle
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge openmausbot || true
      - name: Checksums
        run: |
          cd release
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS-linux-x64.txt
          cat SHA256SUMS-linux-x64.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$tag is already published — bump the version first"
            exit 1
          fi
          files=(release/*.deb release/*.AppImage release/latest-linux.yml release/SHA256SUMS-linux-x64.txt)
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
          done
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            args=(--title "MimirBot $v" --generate-notes --target "$GITHUB_SHA")
            [ "$PUBLISH" = "true" ] || args+=(--draft)
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi
          gh release view "$tag" --json url,isDraft --jq '"release \(.url) — draft: \(.isDraft)"'
